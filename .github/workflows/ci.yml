name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Skip the engine jobs when no code changed (PR: vs base; push: vs the last green main commit;
    # dispatch always runs). Skipped jobs satisfy required checks; a workflow-level paths filter would not.
    # Rules and reasoning: scripts/ci-gate.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-gate.sh ci.yml

  build:
    needs: changes
    # Matrix job: NOT skipped at job level (a skipped matrix job reports an unexpanded name, which
    # leaves the required check pending). It starts, and every step is gated on engine instead.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: needs.changes.outputs.engine == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - if: needs.changes.outputs.engine == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - if: needs.changes.outputs.engine == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.engine == 'true'
        run: pnpm run ci

  plugin:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npx -y @anthropic-ai/claude-code@2.1.327 plugin validate . --strict
      - run: npx -y @anthropic-ai/claude-code@2.1.327 plugin validate ./plugin --strict

  hook:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash scripts/test-container-hook.sh

  hook-macos:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: HOOK_BASH=/bin/bash bash scripts/test-container-hook.sh

  plugin-bundle:
    needs: changes
    # DECISIONS D19: the committed plugin bundle, gallery renders and docs must match the
    # sources. Strict since the end of integration.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.engine == 'true'
        run: pnpm run check:plugin
      - if: needs.changes.outputs.engine == 'true'
        run: pnpm run build
      - if: needs.changes.outputs.engine == 'true'
        run: pnpm run check:gallery
      - run: pnpm run docs:build
      - name: Docs serve the schema byte-identical at its $id path
        run: |
          cmp docs/.vitepress/dist/schema/v1.json schema/v1.json
          # shellcheck disable=SC2016
          id=$(sed -n 's/^ *"\$id": *"\(.*\)".*/\1/p' schema/v1.json | head -n 1)
          [ "$id" = "https://platformcosmo.io/schema/v1.json" ] || { echo "unexpected \$id: $id" >&2; exit 1; }
          path=${id#https://platformcosmo.io}
          [ -f "docs/.vitepress/dist$path" ] || { echo "docs site does not serve $path" >&2; exit 1; }
