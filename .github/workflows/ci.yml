name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx -y @anthropic-ai/claude-code@2.1.327 plugin validate . --strict
      - run: npx -y @anthropic-ai/claude-code@2.1.327 plugin validate ./plugin --strict

  hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash scripts/test-container-hook.sh

  hook-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: HOOK_BASH=/bin/bash bash scripts/test-container-hook.sh

  plugin-bundle:
    # DECISIONS D19: the committed plugin bundle, gallery renders and docs must match the
    # sources. Strict since the end of integration.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:plugin
      - run: pnpm run build
      - run: pnpm run check:gallery
      - run: pnpm run docs:build
      - name: Docs serve the schema byte-identical at its $id path
        run: |
          cmp docs/.vitepress/dist/schema/v1.json schema/v1.json
          # shellcheck disable=SC2016
          id=$(sed -n 's/^ *"\$id": *"\(.*\)".*/\1/p' schema/v1.json | head -n 1)
          [ "$id" = "https://platformcosmo.io/schema/v1.json" ] || { echo "unexpected \$id: $id" >&2; exit 1; }
          path=${id#https://platformcosmo.io}
          [ -f "docs/.vitepress/dist$path" ] || { echo "docs site does not serve $path" >&2; exit 1; }
