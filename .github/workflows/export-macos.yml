name: Export (macOS)

# PLAN section 14 (v1.2): works on macOS and Linux; outputs must be deterministic across OS.
# macOS minutes are costly, so PRs only run this when export-related paths change.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/core/src/export/**"
      - "packages/core/src/emit/**"
      - "packages/core/src/anim/**"
      - "packages/cli/**"
      - "plugin/bin/**"
      - "scripts/check-export.sh"
      - ".github/workflows/export-macos.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: export-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  changes:
    # Skip the macOS job when no code changed (see scripts/ci-gate.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-gate.sh export-macos.yml

  export-macos:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Install ffmpeg (CI runner only)
        run: brew install ffmpeg
      # Default fps/duration (one full loop, 336 frames at 24 fps): streamed export, D33.
      - name: Export with the workspace CLI
        run: |
          PCOSMO_PACKS_DIR="$(mktemp -d)" node packages/cli/dist/bin.js build examples/load-balancing.cosmo.json --gif --mp4 --png --static -o out/cli
      - name: Check CLI exports
        run: bash scripts/check-export.sh out/cli --frames 336 --fps 24
      - name: Export with the bundled plugin CLI
        run: |
          PCOSMO_PACKS_DIR="$(mktemp -d)" plugin/bin/pcosmo build examples/load-balancing.cosmo.json --gif --png -o out/plugin
      - name: Check plugin exports
        run: bash scripts/check-export.sh out/plugin --gif-only --frames 336 --fps 24
      - name: Upload outputs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: export-macos-out
          path: out
          retention-days: 7
