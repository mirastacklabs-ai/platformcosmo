name: Release

# The Changesets "version packages" PR is opened by changesets/action. PRs opened with the
# default GITHUB_TOKEN do NOT trigger other workflows, so CI would never run on it. Set the
# secret RELEASE_BOT_TOKEN (a GitHub App installation token or a fine-grained PAT with
# contents + pull-requests write) so the version PR triggers CI. The bot that commits the
# version bump must be exempt from the DCO check (it cannot add a Signed-off-by trailer).
# Without the secret this falls back to GITHUB_TOKEN and the version PR needs a manual CI run.
#
# Tests are not repeated on code that already passed: scripts/ci-gate.sh looks for the newest main
# commit green in ci, browser and visual-regression; if no code changed since, only `pnpm build` runs.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    if: github.repository == 'mirastacklabs-ai/platformcosmo' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-gate.sh ci.yml browser.yml visual-regression.yml
      - if: steps.gate.outputs.engine == 'true'
        run: pnpm run ci
      - if: steps.gate.outputs.engine != 'true'
        run: pnpm build # publish needs dist; tests already passed on identical code
      - name: Refuse to release while stage stubs remain
        run: "! grep -rl 'not implemented: owned by Track' packages/*/src"
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          publish: pnpm changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
          github-token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          createGithubReleases: false # one GitHub release, for the CLI only (next step)
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      # One GitHub release per CLI version (platformcosmo@<version>), none for the @platformcosmo/* packages.
      # Idempotent and independent of the changesets action's outputs: runs on every push and creates the
      # release only once that version is on npm, at the commit that set it, with its CHANGELOG section.
      - name: GitHub release for the CLI
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version packages/cli/package.json)
          tag="platformcosmo@$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag: release exists"; exit 0
          fi
          if [ "$(npm view "platformcosmo@$version" version 2>/dev/null)" != "$version" ]; then
            echo "$tag: not on npm; no release"; exit 0
          fi
          target=$(git log -1 --format=%H -- packages/cli/package.json)
          awk -v v="$version" '$0 == "## " v {f=1; next} /^## / && f {exit} f' packages/cli/CHANGELOG.md \
            > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$target" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --latest
