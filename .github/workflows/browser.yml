name: Browser

# Browser matrix (PLAN §13): Chromium, Firefox and WebKit via the pinned Playwright
# container, then real Safari on macOS via safaridriver. Evidence is uploaded as artifacts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/pc install --frozen-lockfile
      - name: Browser check on the generated fixtures
        run: tests/browser/run.sh
      - name: Render the launch examples and dc-hall with the CLI (animated + interactive)
        if: always()
        run: |
          scripts/pc run build
          mkdir -p tests/browser/real
          for f in load-balancing rag-pipeline kubernetes-deployment cdn-cache gpu-inference-cluster dc-hall; do
            scripts/pc exec node packages/cli/dist/bin.js build "examples/$f.cosmo.json" \
              -o tests/browser/real --interactive
          done
      - name: Browser check on the real CLI output
        if: always()
        run: OUT=tests/browser/out-real tests/browser/run.sh tests/browser/real
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-check
          path: |
            tests/browser/out/
            tests/browser/out-real/
            tests/browser/real/

  safari-check:
    needs: browser-check
    # macOS minutes are scarce: run on main, manual dispatch, or PRs labelled "browser"; keep
    # going when the Playwright job failed so Safari evidence is still collected.
    if: ${{ !cancelled() && needs.browser-check.result != 'cancelled' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'browser')) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-check
          path: tests/browser
      - run: sudo safaridriver --enable
      - name: Safari checks (Reduce Motion off, then on) on fixtures and real output
        run: tests/browser/safari-ci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-check
          path: tests/browser/out-safari/
