name: Browser

# Browser matrix (PLAN §13): Chromium, Firefox and WebKit via the pinned Playwright
# container, then real Safari on macOS via safaridriver. Evidence is uploaded as artifacts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      safari_only:
        description: "Run only the Safari job, rendering its own inputs on macOS (fast loop)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Skip the engine jobs when no code changed (PR: vs base; push: vs the last green main commit;
    # dispatch always runs). Skipped jobs satisfy required checks; a workflow-level paths filter would not.
    # Rules and reasoning: scripts/ci-gate.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-gate.sh browser.yml

  browser-check:
    needs: changes
    if: ${{ needs.changes.outputs.engine == 'true' && !inputs.safari_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/pc install --frozen-lockfile
      - name: Browser check on the generated fixtures
        run: tests/browser/run.sh
      - name: Render the launch examples and dc-hall with the CLI (animated + interactive, smil and css motion)
        if: always()
        run: |
          scripts/pc run build
          mkdir -p tests/browser/real
          for f in load-balancing rag-pipeline kubernetes-deployment cdn-cache gpu-inference-cluster dc-hall; do
            scripts/pc exec node packages/cli/dist/bin.js build "examples/$f.cosmo.json" \
              -o tests/browser/real --interactive
            # CSS offset-path variant (D32): <name>.css-motion.svg, same checks
            scripts/pc exec node packages/cli/dist/bin.js build "examples/$f.cosmo.json" \
              -o tests/browser/real --interactive --motion css --name "$f.css-motion"
          done
      - name: Browser check on the real CLI output
        if: always()
        run: BROWSER_OUT=tests/browser/out-real tests/browser/run.sh tests/browser/real
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-check
          path: |
            tests/browser/out/
            tests/browser/out-real/
            tests/browser/real/

  safari-check:
    needs: [changes, browser-check]
    # macOS minutes are scarce: run on main, manual dispatch, or PRs labelled "browser"; keep
    # going when the Playwright job failed so Safari evidence is still collected.
    if: ${{ !cancelled() && needs.changes.outputs.engine == 'true' && needs.browser-check.result != 'cancelled' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'browser')) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.safari_only }}
        with:
          name: browser-check
          path: tests/browser
      - name: Render the examples on macOS (safari_only fast loop)
        if: ${{ inputs.safari_only }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p tests/browser/real
          for f in load-balancing rag-pipeline kubernetes-deployment cdn-cache gpu-inference-cluster dc-hall; do
            node packages/cli/dist/bin.js build "examples/$f.cosmo.json" -o tests/browser/real --interactive
            node packages/cli/dist/bin.js build "examples/$f.cosmo.json" -o tests/browser/real --interactive --motion css --name "$f.css-motion"
          done
      - run: sudo safaridriver --enable
      - name: Safari checks (Reduce Motion off, then on) on fixtures and real output
        env:
          SAFARI_INPUTS: ${{ inputs.safari_only && 'real' || 'out/fixtures real' }}
        run: tests/browser/safari-ci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-check
          path: tests/browser/out-safari/
