name: Browser

# Browser matrix (PLAN §13): Chromium, Firefox and WebKit via the pinned Playwright
# container, then real Safari on macOS via safaridriver. Evidence is uploaded as artifacts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/pc install --frozen-lockfile
      - run: tests/browser/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-check
          path: tests/browser/out/

  safari-check:
    needs: browser-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-check
          path: tests/browser/out
      - run: sudo safaridriver --enable
      - name: Run Safari checks
        run: |
          safaridriver -p 4444 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4444/status >/dev/null && break
            [ "$i" = 30 ] && { echo "safaridriver did not start" >&2; exit 1; }
            sleep 1
          done
          INPUT_DIR=tests/browser/out/fixtures GIT_SHA=$(git describe --always --dirty) \
            node tests/browser/safari.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-check
          path: tests/browser/out/results-safari.json
