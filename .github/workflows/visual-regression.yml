name: Visual regression

# PLAN §13: render the bundled-icon examples to PNG with the built CLI (resvg, deterministic) and
# compare with the committed goldens in tests/visual/golden. Update goldens locally with
# `VISUAL_UPDATE=1 scripts/pc run visual` and commit them. Matrix over the Node 22 and 24 images;
# exact match, a missing golden fails (VISUAL_REQUIRE_GOLDENS), updates are refused in CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Skip the engine jobs when no code changed (PR: vs base; push: vs the last green main commit;
    # dispatch always runs). Skipped jobs satisfy required checks; a workflow-level paths filter would not.
    # Rules and reasoning: scripts/ci-gate.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-gate.sh visual-regression.yml

  visual:
    needs: changes
    # Matrix job: NOT skipped at job level (a skipped matrix job reports an unexpanded name, which
    # leaves the required check pending). It starts, and every step is gated on engine instead.
    name: visual (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [node:22-bookworm-slim, node:24.21-bookworm-slim]
    env:
      PC_NODE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.engine == 'true'
        run: scripts/pc install --frozen-lockfile
      - if: needs.changes.outputs.engine == 'true'
        run: scripts/pc run visual
        env:
          VISUAL_REQUIRE_GOLDENS: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: visual-regression-${{ strategy.job-index }}
          # actual renders, diffs (differences in red) and the results summary
          path: |
            tests/visual/out/actual/
            tests/visual/out/diff/
            tests/visual/out/results.json
